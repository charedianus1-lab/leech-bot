[phases.setup]
nixPkgs = ["python311", "gcc", "aria2", "ffmpeg", "p7zip", "rclone", "file", "file.out", "git", "curl"]

[phases.install]
cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r requirements.txt && sed -i 's/from re import sre_parse/import sre_parse/;s/from re import sre_constants/import sre_constants/' /opt/venv/lib/python3.11/site-packages/lk21/thirdparty/exrex.py"]

[start]
cmd = "bash start.sh"
